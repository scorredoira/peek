# peek's errors are read by a person at a terminal, not by Go code, and they lead with the
# thing they are about: "Chrome not found. Install Google Chrome or Chromium", "usage: start
# :PORT command...". Chrome is a proper noun and a usage line ends in an ellipsis, so ST1005
# (no capital, no trailing punctuation) is a false positive here — lowercasing "chrome" would
# make the message worse, which is the one thing a style rule may never buy. Disabled in THIS
# package only; every other staticcheck rule still applies.
checks = ["inherit", "-ST1005"]
